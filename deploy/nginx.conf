# RoofEstimate nginx site config.
# Installed at /etc/nginx/sites-available/roof by deploy/setup.sh.
# The placeholder __UI_BUILD_DIR__ is sed-replaced during install.

# SSE-friendly upstream: long timeouts, no buffering.
upstream roof_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Reasonable defaults for an aerial-imagery API
    client_max_body_size 5M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # gzip the UI bundles
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API: reverse-proxy to uvicorn ────────────────────────────────────────
    location /api/ {
        # Strip /api/ prefix before forwarding so paths line up with FastAPI
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://roof_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE: disable buffering so events stream live
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ── UI: static files from the Vite production build ──────────────────────
    root __UI_BUILD_DIR__;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint for the load balancer / monitoring
    location = /health {
        proxy_pass http://roof_api/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
